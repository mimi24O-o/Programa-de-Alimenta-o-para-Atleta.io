<!DOCTYPE html>
<html lang= "pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" contet="width=device-width, initial-scale=1.0">

    <title>Controle de Alimentação do Atleta</title>
    <link rel=stylesheet" href="style.css">
  </head>
<body>
  <header class="topo">
    <div class="marca">
      <div class="icone-marca"> 🏆 </div>
      <div>
      </h1>AtletaControl</h1>
        <p>Controle de alimentação e rotina esportiva</p>
      </div>
    </div>
    <button id="btnTema" class="btn btn-tema">
      🌙 Tema escuro
    </button>
  </header>
  <main class="container">
    <!--PERFIL-->
    <selection class="card">
      <div class="titulo">
        <h2>👤 Perfil do atleta</h2>
        <p>
          informações para organização dos registros
        </p>
      </div>
      <div class="campo">
        <label>Nome</label>
        <input 
        type="text"
          id="atletaNome"
          placeholder="Nome do atleta">
          </div>
      <div class="campo">
        <label>Modalidade</label>
        <input
          type="text
          id="modalidade"
        placeholder="Ex.:futebol">
      </div> 
    <div class="campo">
     <label>Equipe / Clube</label>
      <input
        type="text"
        id="equipe
        placeholder="Nome da equipe">
    </div>
      <div class="campo">
        <label>Data</label>
        <input
          type="date"
          id="dataRegistro">
      </div>
    </div>
    </selection>
    <!--Resumo-->
    <selection class="indicador">
      <span>🍽</span>
      <div>
        <small>Refeições registradas</small>
        <strong id="totalRefeicoes">0</strong>
        </div
          </div>
      <div class="indicador água">
        <span>💧</span>
        <div>
          <small>Água registrada</small>
          <strong id="aguaTotal">0L</strong>
        </div>
        </div>
      <div class:"indicador sono">
        <span>😴</span>
        <div>
          <small>Sono</small>
          <string id=
        </div></div>
      </body>
